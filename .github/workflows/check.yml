name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # The opencode index, the marketplace and the shared copies agree with skills/.
      - run: node scripts/gen-index.mjs --check
      # The worked example passes the checks the skill tells agents to run.
      - run: node skills/grove-report/scripts/check-report.mjs skills/grove-report/example
